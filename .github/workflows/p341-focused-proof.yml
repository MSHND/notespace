name: P341 focused proof

on:
  push:
    branches:
      - candidate/p341-proof

permissions:
  contents: read

jobs:
  p341-focused-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: P341 ownership foundation
        run: node --test tests/p341-account-reselection-foundation.test.js
      - name: P341 account and remote contracts
        run: node --test tests/p031-sync-account-client.test.js tests/p032-sync-remote-client.test.js
      - name: P341 service and HTTP session boundary
        run: node --test tests/p034-sync-service-core.test.js tests/p046-sync-http-adapter.test.js
      - name: P341 additional-device composition
        run: node --test --test-name-pattern="P341|P052 remains dormant|P052i1|P052c public browser Device B adoption" tests/p052-additional-device.test.js
      - name: P341 ownerless preservation
        run: node --test tests/p280-first-create-existing-account.test.js tests/p288-ownerless-account-ready-convergence.test.js tests/p301-ownerless-first-create-runtime-start.test.js tests/p302-ownerless-durable-continuation.test.js
      - name: P341 diagnostic regression
        run: node --test tests/p335-safe-not-configured-account-diagnostic-hint.test.js
      - name: Repository check
        run: npm run check
