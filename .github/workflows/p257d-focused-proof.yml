name: P257d focused proof

on:
  push:
    branches:
      - candidate/p257d-proof

jobs:
  p257d-focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: timeout 300s node --test tests/p257d-native-file-picker-focus-ownership.test.js tests/p255-new-pocket-first-use.test.js tests/p206d-pocket-file-opening-compatibility.test.js tests/p019-vault-ownership.test.js tests/p045-browser-sync-runtime.test.js tests/device-changes-resolution.test.js
      - run: timeout 180s npm run check
