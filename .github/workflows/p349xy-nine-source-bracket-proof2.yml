name: P349xy corrected nine-source identity bracket proof
on:
  push:
    branches: [candidate/p349xy-proof2]
jobs:
  nine-source-abort:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
        timeout-minutes: 3
      - name: P349xy corrected bracket plus native projection regressions
        run: node --test tests/p349xy-nine-source-bracket-rehearsal.test.js tests/p349xv-google-native-paragraph-projection.test.js tests/p349wz-google-full-source-projection.test.js
        timeout-minutes: 3
      - name: Normal Pocket check
        run: npm run check
        timeout-minutes: 3
