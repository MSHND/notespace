name: P206d focused proof

on:
  push:
    branches:
      - candidate/p206d-proof

jobs:
  p206d-focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3efb413e513da733e548e69ed84652e3c0db00d
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: timeout 120s npm ci
      - run: timeout 120s node --test tests/p206d-pocket-file-opening-compatibility.test.js
      - run: timeout 120s npm run check
