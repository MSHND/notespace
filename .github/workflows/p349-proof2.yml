name: P349 focused proof 2

on:
  push:
    branches:
      - candidate/p349-proof2
  workflow_dispatch:

jobs:
  p349-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Focused P349 proof
        run: >-
          node --test
          tests/p349-project-documents-schema.test.js
          tests/p349-project-documents-store.test.js
          tests/p349-project-documents-auth.test.js
          tests/p349-project-documents-mcp.test.js
          tests/p349-project-documents-production-composition.test.js
          tests/p049-sync-server-runtime.test.js
          tests/p074-production-composition.test.js
          tests/p076-production-browser-boundary.test.js
          tests/p077-render-blueprint-contract.test.js
          tests/p078-migration-diagnostic.test.js
          tests/p176-production-composition.test.js
      - name: Full Pocket check
        run: npm run check
