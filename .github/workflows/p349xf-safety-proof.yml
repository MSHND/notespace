name: P349xf isolated safety proof
on:
  push:
    branches: [candidate/p349xf-proof]
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        timeout-minutes: 3
      - name: Release storage safety and baseline contract tests
        run: node --test tests/p349xf-handover-release-safety-store.test.js tests/p349-project-documents-store.test.js tests/p349-project-documents-auth.test.js tests/p349wz-google-full-source-projection.test.js tests/p349wx-handover-publication-preflight.test.js
        timeout-minutes: 3
      - name: Normal Pocket check
        run: npm run check
        timeout-minutes: 2
