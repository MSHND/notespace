name: P273b focused proof

on:
  push:
    branches:
      - candidate/p273b-proof

jobs:
  p273b-focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: P273b row-menu shortcut regressions
        timeout-minutes: 8
        run: >
          timeout --signal=TERM --kill-after=10s 420s
          node --test
          tests/p273b-plain-period-retirement.test.js
          tests/p273-row-mini-menu-owner.test.js
          tests/p249-main-type-to-filter-unification.test.js
      - name: Repository check
        timeout-minutes: 4
        run: timeout --signal=TERM --kill-after=10s 180s npm run check
