name: P243a focused proof

on:
  push:
    branches:
      - candidate/p243a-proof

jobs:
  p243a-focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/p243-main-known-target-selection-projection.test.js
      - run: npm run check
