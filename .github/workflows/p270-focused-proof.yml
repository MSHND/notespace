name: P270 focused proof

on:
  push:
    branches:
      - candidate/p270-proof

jobs:
  p270-focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: timeout 300s node --test tests/p270-main-save-blank-new-provisional-resolution.test.js tests/p210-friction-pack.test.js tests/p210-browser-lexical-scope.test.js tests/p153-starling-owner-manual-insert-undo-cancel.test.js tests/p264-main-rapid-entry-tab.test.js
      - run: timeout 180s npm run check
