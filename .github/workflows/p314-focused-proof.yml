name: P314 focused proof

on:
  push:
    branches:
      - candidate/p314-proof

jobs:
  p314-focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: P314 delete-confirmation Space regressions
        timeout-minutes: 8
        run: >
          timeout --signal=TERM --kill-after=10s 420s
          node --test
          tests/p281g-delete-confirmation-card.test.js
          tests/p273-row-mini-menu-owner.test.js
          tests/p273b-plain-period-retirement.test.js
      - name: Repository check
        timeout-minutes: 4
        run: timeout --signal=TERM --kill-after=10s 180s npm run check
