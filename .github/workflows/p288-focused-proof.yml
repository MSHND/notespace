name: P288 focused proof

on:
  push:
    branches:
      - candidate/p288-proof

jobs:
  p288-focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: P288 ownerless account-ready convergence
        timeout-minutes: 7
        run: timeout --signal=TERM --kill-after=10s 360s node --test tests/p288-ownerless-account-ready-convergence.test.js
      - name: P278 P279 account client privacy and intents
        timeout-minutes: 7
        run: timeout --signal=TERM --kill-after=10s 360s node --test tests/p031-sync-account-client.test.js
      - name: P280 existing-account first-create private bridge
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=10s 240s node --test tests/p280-first-create-existing-account.test.js
      - name: P284 ownerless v2 contract and discovery
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=10s 240s node --test tests/p284-ownerless-v2-draft-discovery.test.js
      - name: P285 ownerless completion recognition
        timeout-minutes: 4
        run: timeout --signal=TERM --kill-after=10s 180s node --test tests/p285-ownerless-v2-completion-recognition.test.js
      - name: P286 shared-kernel structure
        timeout-minutes: 4
        run: timeout --signal=TERM --kill-after=10s 180s node --test tests/p286-activation-shared-execution-kernel.test.js
      - name: P286 v1 JSON Vault behaviour
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=10s 240s node --test tests/p286-activation-v1-behaviour.test.js
      - name: P287 local ownerless staging
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=10s 240s node --test tests/p287-ownerless-v2-local-staging.test.js
      - name: P039 dormant activation surface
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=10s 120s node --test --test-name-pattern="P039 module is one dormant, inert and exact frozen activation boundary" tests/p039-sync-activation.test.js
      - name: P040 v1 adoption and resume behaviours
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=10s 240s node --test --test-name-pattern="successful adoption|genuine pre-adoption|owner-adapter failure|post-adoption persistence|adopted draft corruption|non-adopted resume" tests/p040-owner-adoption-finalisation.test.js
      - name: Repository check
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=10s 240s npm run check
