name: Pocket disposable browser playground

on:
  push:
    branches:
      - candidate/native-core-portable-20261023
    paths:
      - 'native-proof/**'
      - '.github/workflows/native-proof-playground.yml'
  pull_request:
    paths:
      - 'native-proof/**'
      - '.github/workflows/native-proof-playground.yml'

permissions:
  contents: read

jobs:
  web-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prove clean exact checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain)"
      - name: Check committed single-file actual core bundle
        shell: bash
        run: node native-proof/playground/tests/web-core-smoke.mjs
      - name: Install WebAssembly linker
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lld
          command -v wasm-ld
      - name: Recompile C11 to fresh WebAssembly HTML
        shell: bash
        run: |
          clang --version
          wasm-ld --version
          bash native-proof/playground/build-html.sh "$RUNNER_TEMP/standalone.html"
      - name: Test rebuilt WebAssembly independently
        shell: bash
        run: node native-proof/playground/tests/web-core-smoke.mjs "$RUNNER_TEMP/standalone.html"
      - name: Emit disposable built core for committed-page generation
        shell: bash
        run: |
          python3 -c 'import re,sys; h=open(sys.argv[1],encoding="utf-8").read(); b=re.search(r"<script id=\"core-wasm\" type=\"application/octet-stream\">([A-Za-z0-9+/=]+)</script>",h).group(1); print("CORE_START"); [print("CORE_CHUNK:"+b[i:i+96]) for i in range(0,len(b),96)]; print("CORE_END")' "$RUNNER_TEMP/standalone.html"

