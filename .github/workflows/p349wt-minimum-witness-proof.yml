name: P349wt minimum handover witness proof

on:
  push:
    branches:
      - candidate/p349wt-proof

permissions:
  contents: read

jobs:
  minimum-witness-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Minimum core and safety dependency proofs
        run: timeout 90s node --test tests/p349wt-handover-minimum-release-witness.test.js tests/p349wq-handover-release-witness.test.js
      - name: Existing repository check
        run: timeout 90s npm run check
