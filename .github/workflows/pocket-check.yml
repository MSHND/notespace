name: Pocket check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pocket-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact workflow commit and ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout and history
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ github.sha }}"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          printf 'POCKET_CHECK_SHA=%s\n' "$actual"

      - name: Establish Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Node 24
        run: |
          node --version
          case "$(node --version)" in
            v24.*) ;;
            *) exit 1 ;;
          esac

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove stable core and changed candidate tests
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet refs/remotes/origin/main
          base="$(git merge-base HEAD refs/remotes/origin/main)"
          test -n "$base"
          git cat-file -e "$base^{commit}"
          git diff --check "$base" HEAD
          git diff --name-only -z --diff-filter=ACMRT "$base" HEAD -- tests/ > "$RUNNER_TEMP/pocket-changed-tests"

          required=(
            tests/p139-starling-logical-working-set-compose.test.js
            tests/p146-starling-accepted-document-materialize.test.js
            tests/p160-starling-owner-save-preparation.test.js
            tests/p172-real-p168-composition.test.js
            tests/p172-real-truth-cutover-admission.test.js
            tests/p190-starling-save-observability-and-reentry.test.js
            tests/p346o-two-node-pipeline-coalescing.test.js
            tests/p346y-bounded-post-cas-acceptance.test.js
            tests/p366-authenticated-snapshot-cursor.test.js
            tests/p368-accepted-snapshot-reader.test.js
            tests/p370-progressive-open-state.test.js
          )
          declare -A selected=()
          for file in "${required[@]}"; do
            test -f "$file"
            selected["$file"]=1
          done
          stable_count="${#required[@]}"
          changed_count=0
          while IFS= read -r -d '' file; do
            if [[ "$file" =~ ^tests/[^/]+\.test\.js$ ]]; then
              test -f "$file"
              changed_count=$((changed_count + 1))
              printf 'POCKET_CHANGED_TEST %s\n' "$file"
              if [[ -z "${selected[$file]+present}" ]]; then
                required+=("$file")
                selected["$file"]=1
              fi
            fi
          done < "$RUNNER_TEMP/pocket-changed-tests"
          printf 'POCKET_TEST_SELECTION base=%s head=%s stable=%s changed=%s unique=%s\n' \
            "$base" "$(git rev-parse HEAD)" "$stable_count" "$changed_count" "${#required[@]}"
          printf 'POCKET_REQUIRED_TEST %s\n' "${required[@]}"

          timeout --signal=TERM --kill-after=15s 900s \
            node --test --test-reporter=tap "${required[@]}" | tee "$RUNNER_TEMP/pocket-tests.tap"
          declare -A totals=()
          for key in tests pass fail skipped cancelled todo; do
            value="$(sed -n "s/^# $key \([0-9][0-9]*\)$/\1/p" "$RUNNER_TEMP/pocket-tests.tap" | tail -n 1)"
            [[ "$value" =~ ^[0-9]+$ ]] || { echo "Missing TAP $key count"; exit 1; }
            totals["$key"]="$value"
          done
          printf 'POCKET_TEST_TOTALS tests=%s pass=%s fail=%s skipped=%s cancelled=%s todo=%s\n' \
            "${totals[tests]}" "${totals[pass]}" "${totals[fail]}" \
            "${totals[skipped]}" "${totals[cancelled]}" "${totals[todo]}"
          test "${totals[tests]}" -gt 0
          test "${totals[pass]}" -eq "${totals[tests]}"
          test "${totals[fail]}" -eq 0
          test "${totals[skipped]}" -eq 0
          test "${totals[cancelled]}" -eq 0
          test "${totals[todo]}" -eq 0

      - name: Pocket static check
        run: npm run check
