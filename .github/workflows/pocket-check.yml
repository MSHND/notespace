name: Pocket check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pocket-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p382_disposable_test_only
          POSTGRES_DB: pocket_p382_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pocket_p382_research"
          --health-interval 5s --health-timeout 3s --health-retries 15
    timeout-minutes: 25
    steps:
      - name: Checkout exact workflow commit and ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout and history
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ github.sha }}"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          printf 'POCKET_CHECK_SHA=%s\n' "$actual"

      - name: Establish Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Node 24
        run: |
          node --version
          case "$(node --version)" in
            v24.*) ;;
            *) exit 1 ;;
          esac

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove stable core and changed candidate tests
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet refs/remotes/origin/main
          base="$(git merge-base HEAD refs/remotes/origin/main)"
          test -n "$base"
          git cat-file -e "$base^{commit}"
          git diff --check "$base" HEAD
          git diff --name-only -z --diff-filter=ACMRT "$base" HEAD -- tests/ > "$RUNNER_TEMP/pocket-changed-tests"

          required=(
            tests/p139-starling-logical-working-set-compose.test.js
            tests/p146-starling-accepted-document-materialize.test.js
            tests/p160-starling-owner-save-preparation.test.js
            tests/p172-real-p168-composition.test.js
            tests/p172-real-truth-cutover-admission.test.js
            tests/p190-starling-save-observability-and-reentry.test.js
            tests/p346o-two-node-pipeline-coalescing.test.js
            tests/p346y-bounded-post-cas-acceptance.test.js
            tests/p366-authenticated-snapshot-cursor.test.js
            tests/p368-accepted-snapshot-reader.test.js
            tests/p370-progressive-open-state.test.js
          )
          declare -A selected=()
          for file in "${required[@]}"; do
            test -f "$file"
            selected["$file"]=1
          done
          stable_count="${#required[@]}"
          changed_count=0
          while IFS= read -r -d '' file; do
            if [[ "$file" =~ ^tests/[^/]+\.test\.js$ ]]; then
              test -f "$file"
              changed_count=$((changed_count + 1))
              printf 'POCKET_CHANGED_TEST %s\n' "$file"
              if [[ -z "${selected[$file]+present}" ]]; then
                required+=("$file")
                selected["$file"]=1
              fi
            fi
          done < "$RUNNER_TEMP/pocket-changed-tests"
          printf 'POCKET_TEST_SELECTION base=%s head=%s stable=%s changed=%s unique=%s\n' \
            "$base" "$(git rev-parse HEAD)" "$stable_count" "$changed_count" "${#required[@]}"
          printf 'POCKET_REQUIRED_TEST %s\n' "${required[@]}"

          timeout --signal=TERM --kill-after=15s 900s \
            node --test --test-reporter=tap "${required[@]}" | tee "$RUNNER_TEMP/pocket-tests.tap"
          declare -A totals=()
          for key in tests pass fail skipped cancelled todo; do
            value="$(sed -n "s/^# $key \([0-9][0-9]*\)$/\1/p" "$RUNNER_TEMP/pocket-tests.tap" | tail -n 1)"
            [[ "$value" =~ ^[0-9]+$ ]] || { echo "Missing TAP $key count"; exit 1; }
            totals["$key"]="$value"
          done
          printf 'POCKET_TEST_TOTALS tests=%s pass=%s fail=%s skipped=%s cancelled=%s todo=%s\n' \
            "${totals[tests]}" "${totals[pass]}" "${totals[fail]}" \
            "${totals[skipped]}" "${totals[cancelled]}" "${totals[todo]}"
          test "${totals[tests]}" -gt 0
          test "${totals[pass]}" -eq "${totals[tests]}"
          test "${totals[fail]}" -eq 0
          test "${totals[skipped]}" -eq 0
          test "${totals[cancelled]}" -eq 0
          test "${totals[todo]}" -eq 0

      - name: Pocket static check
        run: npm run check

      - name: P382 and P383 real Chromium and disposable PostgreSQL research
        if: github.ref == 'refs/heads/research/pocket-chromium-postgres-20261116' || github.ref == 'refs/heads/codex/pocket-h1-browser-recovery-20261118' || github.ref == 'refs/heads/codex/pocket-auth-stage-bridge-20261118' || github.ref == 'refs/heads/research/pocket-p386-chatgpt-20261118' || github.event_name == 'pull_request'
        shell: bash
        env:
          POCKET_SYNC_DATABASE_URL: postgresql://postgres:p382_disposable_test_only@127.0.0.1:5432/pocket_p382_research
          POCKET_P382_CERT: /tmp/pocket-p382-research.crt
          POCKET_P382_KEY: /tmp/pocket-p382-research.key
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          npm run sync:db:migrate
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$POCKET_P382_KEY" -out "$POCKET_P382_CERT" >/dev/null 2>&1
          chmod 600 "$POCKET_P382_KEY"
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN
          timeout --signal=TERM --kill-after=10s 240s node --test --test-reporter=tap pocket-research/2026-11-16/CHROMIUM-POSTGRES/p382-real-browser-postgres-research.test.js
          printf 'P382_SCOPE=real-Chromium-real-Postgres-still-no-user-data-or-production\n'
          timeout --signal=TERM --kill-after=10s 180s node --test --test-reporter=tap pocket-research/2026-11-16/CHROMIUM-POSTGRES/p383-authenticated-open-save-readback.test.js
          timeout --signal=TERM --kill-after=10s 180s node --test --test-reporter=tap pocket-research/2026-11-16/CHROMIUM-POSTGRES/p392-normal-save-button-reopen.test.js
          timeout --signal=TERM --kill-after=10s 180s node --test --test-reporter=tap pocket-research/2026-11-16/CHROMIUM-POSTGRES/p384-title-staging-gap.test.js
          timeout --signal=TERM --kill-after=10s 180s node --test --test-reporter=tap pocket-research/2026-11-16/CHROMIUM-POSTGRES/p385-authenticated-stage-bridge.test.js
          timeout --signal=TERM --kill-after=10s 180s node --test --test-reporter=tap pocket-research/2026-11-16/CHROMIUM-POSTGRES/p386-pending-guard.test.js
          timeout --signal=TERM --kill-after=10s 180s node --test --test-reporter=tap pocket-research/2026-11-16/CHROMIUM-POSTGRES/p386-aborted-stage.test.js
          timeout --signal=TERM --kill-after=10s 180s node --test --test-reporter=tap pocket-research/2026-11-16/CHROMIUM-POSTGRES/p387-authority-repeat-recovery.test.js
          timeout --signal=TERM --kill-after=10s 180s node --test --test-reporter=tap pocket-research/2026-11-16/CHROMIUM-POSTGRES/p388-pending-native-save.test.js
          timeout --signal=TERM --kill-after=10s 180s node --test --test-reporter=tap pocket-research/2026-11-16/CHROMIUM-POSTGRES/p388-save-outcome-unknown.test.js
          timeout --signal=TERM --kill-after=10s 180s node --test --test-reporter=tap pocket-research/2026-11-16/CHROMIUM-POSTGRES/p389-accepted-lost-ack-reconcile.test.js
          timeout --signal=TERM --kill-after=10s 180s node --test --test-reporter=tap pocket-research/2026-11-16/CHROMIUM-POSTGRES/p390-auto-verified-open.test.js
          timeout --signal=TERM --kill-after=10s 180s node --test --test-reporter=tap pocket-research/2026-11-16/CHROMIUM-POSTGRES/p390-superseded-lineage.test.js
          timeout --signal=TERM --kill-after=10s 180s node --test --test-reporter=tap pocket-research/2026-11-16/CHROMIUM-POSTGRES/p390-auto-no-proof-no-authority.test.js
          timeout --signal=TERM --kill-after=10s 180s node --test --test-reporter=tap pocket-research/2026-11-16/CHROMIUM-POSTGRES/p391-app-open-auto-reconcile.test.js
