name: P349 package lock helper

on:
  push:
    branches:
      - candidate/p349-lock

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Generate exact package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lock on helper branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Package lock already exact."
            exit 0
          fi
          git commit -m "P349 generate exact package lock"
          git push origin HEAD:candidate/p349-lock
