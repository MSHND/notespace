name: P355c dormant owner continuity synthetic proof

on:
  push:
    branches:
      - candidate/p355c-proof

jobs:
  owner-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: P355c syntax
        run: |
          node --check js/pocket-sync-owner-continuity-guard.js
          node --check tests/p355c-owner-continuity-guard.test.js
      - name: P355c synthetic, save boundary and discovery regressions
        run: |
          node --test tests/p355c-owner-continuity-guard.test.js tests/p043-owner-aware-save-boundary.test.js tests/p032-sync-remote-client.test.js tests/p046-sync-http-adapter.test.js
      - name: P042 owner-controller regressions excluding two separately measured timing failures
        run: |
          node --test --test-skip-pattern="P042 stale sessions never upload|P042 does not apply a returned remote success" tests/p042-synced-owner-controller.test.js
      - name: Pocket standard check
        run: npm run check

  p042-current-unfiltered:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run full P042 against unchanged P355c candidate
        run: node --test tests/p042-synced-owner-controller.test.js

  p042-accepted-baseline:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cb735581f6d4b5c9018e9799fc3ffb9988d82714
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run same full P042 against accepted main before P355c
        run: node --test tests/p042-synced-owner-controller.test.js
