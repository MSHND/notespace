name: P214 focused proof

on:
  push:
    branches:
      - candidate/p214-proof

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/p214-pe-terminal-boundary-scroll.test.js
