name: P207a focused proof

on:
  push:
    branches:
      - candidate/p207a-proof

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact repaired P207 candidate
        uses: actions/checkout@v4
        with:
          ref: 5678049fab4c105d9c72a3324608546c489c95dd
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused P207 and P207a proof
        run: timeout 180s node --test tests/p207-pe-empty-line-backspace.test.js tests/p207a-pe-collapsed-focus.test.js
      - name: Run ordinary repository check
        run: npm run check
