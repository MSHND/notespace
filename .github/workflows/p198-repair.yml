name: P198 repair active content seam
on:
  push:
    branches:
      - candidate/p198-proof
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/p198
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Guard candidate before repair
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "678872adf4db9de8c0095fff32f603cf1b418faa"
          test "$(git merge-base HEAD 0076739343b9a30c3e56f521ec67b1d87d8b6b2e)" = "0076739343b9a30c3e56f521ec67b1d87d8b6b2e"
      - name: Repair full canonical body path and central structural transforms
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p=Path(path); text=p.read_text(); actual=text.count(old)
              if actual != count: raise SystemExit(f'{path}: expected {count} anchor(s), found {actual}: {old[:100]!r}')
              p.write_text(text.replace(old,new,count))

          # Central contract owns body parsing too, so active in-page/Phone editing cannot fall back to 4k Notes normalisation.
          rep('js/pocket-node-content.js', '''  function validateText(value) {\n    if (typeof value !== "string") return { ok: false, reason: "invalid-editor-text" };''', '''  function parseEditorBody(value) {\n    const source = String(value == null ? "" : value);\n    return {\n      text: normaliseCanonicalText(source),\n      urgent: /(^|\\s)#urgent\\b/i.test(source),\n    };\n  }\n\n  function validateText(value) {\n    if (typeof value !== "string") return { ok: false, reason: "invalid-editor-text" };''')

          rep('js/pocket-node-content.js', '''  function smartContinuation(content) {\n    const marker = parseMarker(content);''', '''  function indentSubtree(lines, index, delta) {\n    if (!Array.isArray(lines) || !Number.isInteger(index) || index < 0 || index >= lines.length\n        || (delta !== 1 && delta !== -1)) return { ok: false, lines };\n    if (delta > 0 && index === 0) return { ok: false, lines };\n    const end = subtreeEnd(lines, index);\n    const copy = lines.map((line) => ({ ...line }));\n    for (let cursor = index; cursor < end; cursor += 1) {\n      const next = (Number(copy[cursor].depth) || 0) + delta;\n      if (next < 0 || next > MAX_DEPTH) return { ok: false, lines };\n    }\n    for (let cursor = index; cursor < end; cursor += 1) copy[cursor].depth += delta;\n    return { ok: true, lines: copy };\n  }\n\n  function siblingBefore(lines, index) {\n    const depth = Number(lines[index]?.depth) || 0;\n    for (let cursor = index - 1; cursor >= 0; cursor -= 1) {\n      const candidateDepth = Number(lines[cursor]?.depth) || 0;\n      if (candidateDepth === depth) return cursor;\n      if (candidateDepth < depth) break;\n    }\n    return -1;\n  }\n\n  function moveSubtree(lines, index, direction) {\n    if (!Array.isArray(lines) || !Number.isInteger(index) || index < 0 || index >= lines.length\n        || (direction !== "up" && direction !== "down")) return { ok: false, lines };\n    const depth = Number(lines[index].depth) || 0;\n    const end = subtreeEnd(lines, index);\n    const target = direction === "up" ? siblingBefore(lines, index) : end;\n    if (target < 0 || target >= lines.length || (Number(lines[target].depth) || 0) !== depth) {\n      return { ok: false, lines };\n    }\n    const copy = lines.map((line) => ({ ...line }));\n    const branch = copy.splice(index, end - index);\n    if (direction === "up") {\n      copy.splice(target, 0, ...branch);\n    } else {\n      const targetStart = target - branch.length;\n      const targetEnd = subtreeEnd(copy, targetStart);\n      copy.splice(targetEnd, 0, ...branch);\n    }\n    return { ok: true, lines: copy };\n  }\n\n  function smartContinuation(content) {\n    const marker = parseMarker(content);''')

          rep('js/pocket-node-content.js', '''    validateText,\n    readNode,''', '''    validateText,\n    parseEditorBody,\n    readNode,''')
          rep('js/pocket-node-content.js', '''    subtreeEnd,\n    hasChildren,\n    smartContinuation,''', '''    subtreeEnd,\n    hasChildren,\n    indentSubtree,\n    moveSubtree,\n    smartContinuation,''')

          # Runtime delegates branch transforms to the central structural contract.
          rep('js/pocket-node-popout-runtime.js', '''    function indentBranch(index, delta) {\n      if (readOnly || index < 0) return false; var end = subtreeEnd(index); var rootDepth = lines[index].depth; var nextDepth = rootDepth + delta;\n      if (nextDepth < 0 || nextDepth > 8) return false;\n      if (delta > 0 && index === 0) return false;\n      for (var i = index; i < end; i += 1) { var candidate = lines[i].depth + delta; if (candidate < 0 || candidate > 8) return false; }\n      for (var j = index; j < end; j += 1) lines[j].depth += delta;\n      markMutation(); render(lines[index].id); return true;\n    }\n    function previousSiblingIndex(index) { var depth = lines[index].depth; for (var i = index - 1; i >= 0; i -= 1) { if (lines[i].depth === depth) return i; if (lines[i].depth < depth) break; } return -1; }\n    function nextSiblingIndex(index) { var depth = lines[index].depth; var cursor = subtreeEnd(index); return cursor < lines.length && lines[cursor].depth === depth ? cursor : -1; }\n    function moveBranch(index, direction) {\n      if (readOnly || index < 0 || (direction !== "up" && direction !== "down")) return false;\n      var start = index, end = subtreeEnd(index), target = direction === "up" ? previousSiblingIndex(index) : nextSiblingIndex(index); if (target < 0) return false;\n      var branch = lines.splice(start, end - start);\n      if (direction === "up") lines.splice(target, 0, ...branch);\n      else { var afterTarget = subtreeEnd(target - branch.length); if (target > start) { var targetNow = target - branch.length; afterTarget = subtreeEnd(targetNow); } lines.splice(afterTarget, 0, ...branch); }\n      markMutation(); render(branch[0].id); return true;\n    }''', '''    function indentBranch(index, delta) {\n      if (readOnly || index < 0 || typeof content.indentSubtree !== "function") return false;\n      var transformed = content.indentSubtree(lines, index, delta);\n      if (!transformed || transformed.ok !== true) return false;\n      var id = lines[index].id; lines = transformed.lines; markMutation(); render(id); return true;\n    }\n    function moveBranch(index, direction) {\n      if (readOnly || index < 0 || typeof content.moveSubtree !== "function") return false;\n      var id = lines[index].id; var transformed = content.moveSubtree(lines, index, direction);\n      if (!transformed || transformed.ok !== true) return false;\n      lines = transformed.lines; markMutation(); render(id); return true;\n    }''')

          # Active in-page/Phone body path now keeps the full canonical document, not the 4k details projection.
          rep('js/pocket-editor-copy.js', '''function preparePocketNodeContentWrite(text) {\n  const contract = window.PocketNodeContent;\n  return contract && typeof contract.prepareCanonical === "function"\n    ? contract.prepareCanonical(text)\n    : { ok: true, editor: null, details: normaliseDetails(text, 4000), text: normaliseDetails(text, Number.MAX_SAFE_INTEGER) };\n}\n''', '''function preparePocketNodeContentWrite(text) {\n  const contract = window.PocketNodeContent;\n  return contract && typeof contract.prepareCanonical === "function"\n    ? contract.prepareCanonical(text)\n    : { ok: true, editor: null, details: normaliseDetails(text, 4000), text: normaliseDetails(text, Number.MAX_SAFE_INTEGER) };\n}\n\nfunction parsePocketNodeContentEditorBody(rawValue) {\n  const contract = window.PocketNodeContent;\n  if (contract && typeof contract.parseEditorBody === "function") return contract.parseEditorBody(rawValue);\n  const source = String(rawValue || "");\n  return { text: normaliseDetails(source, Number.MAX_SAFE_INTEGER), urgent: /(^|\\s)#urgent\\b/i.test(source) };\n}\n''')
          rep('js/pocket-editor-copy.js', '''  const baseBody = node\n    ? composeDetailsEditorValue(currentPocketNodeContentText(node), node.urgent)\n    : normaliseDetails(state.detailsEdit.originalContent, Number.MAX_SAFE_INTEGER);''', '''  const baseBody = node\n    ? currentPocketNodeContentText(node)\n    : String(state.detailsEdit.originalContent || "");''')
          rep('js/pocket-editor-copy.js', '''  const nextBody = normaliseDetails(el.detailEditorBody?.value, 4000);\n  const parsedBody = parseUrgentDetailsBody(nextBody);''', '''  const nextBody = String(el.detailEditorBody?.value || "");\n  const parsedBody = parsePocketNodeContentEditorBody(nextBody);''')
          rep('js/pocket-editor-copy.js', '''    || parsedBody.details !== normaliseDetails(baseBody, 4000)''', '''    || parsedBody.text !== parsePocketNodeContentEditorBody(baseBody).text''')
          rep('js/pocket-editor-copy.js', '''  const parsedDetails = parseUrgentDetailsBody(String(el.detailEditorBody?.value || ""));\n  const nextDetails = parsedDetails.details;''', '''  const parsedDetails = parsePocketNodeContentEditorBody(String(el.detailEditorBody?.value || ""));\n  const nextDetails = parsedDetails.text;''', count=1)
          rep('js/pocket-editor-copy.js', '''    el.detailEditorBody.value = composeDetailsEditorValue(contentView.text, node.urgent);''', '''    el.detailEditorBody.value = contentView.text;''')
          rep('js/pocket-editor-copy.js', '''    const parsedBody = parseUrgentDetailsBody(node.details);''', '''    const parsedBody = parsePocketNodeContentEditorBody(contentView.text);''')
          rep('js/pocket-editor-copy.js', '''  const parsedDetails = parseUrgentDetailsBody(\n    canApplyCompletionMove ? stripCompletionTags(rawBodyValue) : rawBodyValue\n  );''', '''  const parsedDetails = parsePocketNodeContentEditorBody(\n    canApplyCompletionMove ? stripCompletionTags(rawBodyValue) : rawBodyValue\n  );''')
          rep('js/pocket-editor-copy.js', '''  const nextDetails = parsedDetails.details;''', '''  const nextDetails = parsedDetails.text;''', count=1)

          # Strengthen focused proof with full-length active body semantics and exact branch transforms.
          p=Path('tests/p198-unified-pe-document.test.js'); text=p.read_text()
          text += r'''\ntest("P198-23 active body parser preserves canonical content beyond legacy 4000-char projection",()=>{const c=ctx();const long="A".repeat(5000)+"\\n  child";const parsed=c.PocketNodeContent.parseEditorBody(long);assert.equal(parsed.text,long);assert.equal(parsed.text.length>4000,true);assert.equal(c.PocketNodeContent.prepareCanonical(parsed.text).editor.text,long);});\ntest("P198-24 subtree indent/outdent transforms the whole plain-text branch exactly",()=>{const c=ctx();const start=c.PocketNodeContent.parseLines("A\\nB\\n  B child\\nC");const ind=c.PocketNodeContent.indentSubtree(start,1,1);assert.equal(ind.ok,true);assert.equal(c.PocketNodeContent.serialiseLines(ind.lines),"A\\n  B\\n    B child\\nC");const out=c.PocketNodeContent.indentSubtree(ind.lines,1,-1);assert.equal(c.PocketNodeContent.serialiseLines(out.lines),"A\\nB\\n  B child\\nC");});\ntest("P198-25 subtree move keeps descendants attached and canonical text exact",()=>{const c=ctx();const start=c.PocketNodeContent.parseLines("A\\n  A child\\nB\\n  B child\\nC");const down=c.PocketNodeContent.moveSubtree(start,0,"down");assert.equal(down.ok,true);assert.equal(c.PocketNodeContent.serialiseLines(down.lines),"B\\n  B child\\nA\\n  A child\\nC");const up=c.PocketNodeContent.moveSubtree(down.lines,2,"up");assert.equal(c.PocketNodeContent.serialiseLines(up.lines),"A\\n  A child\\nB\\n  B child\\nC");});\ntest("P198-26 active in-page body seam no longer routes canonical content through parseUrgentDetailsBody/4000",()=>{const s=source("js/pocket-editor-copy.js");assert.match(s,/parsePocketNodeContentEditorBody/);assert.match(s,/el\\.detailEditorBody\\.value = contentView\\.text/);const start=s.indexOf("function hasUnsavedDetailsEditorChanges");const end=s.indexOf("function inspectActiveInlineTitleDraft",start);assert.doesNotMatch(s.slice(start,end),/normaliseDetails\\([^,]+, 4000\\)|parseUrgentDetailsBody/);});\n'''
          p.write_text(text)
          PY
          git diff --check
      - name: Install and bounded repair proof
        run: |
          set -euo pipefail
          timeout --signal=KILL 180s npm ci
          for f in js/pocket-node-content.js js/pocket-node-popout-runtime.js js/pocket-editor-copy.js; do timeout --signal=KILL 120s node --check "$f"; done
          timeout --signal=KILL 180s node --test tests/p198-unified-pe-document.test.js
          timeout --signal=KILL 180s node --test tests/p018-popout-isolation.test.js
      - name: Commit repair to same candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/pocket-node-content.js js/pocket-node-popout-runtime.js js/pocket-editor-copy.js tests/p198-unified-pe-document.test.js
          git diff --cached --check
          git commit -m "P198 repair full canonical active body seam"
          git push origin HEAD:candidate/p198
