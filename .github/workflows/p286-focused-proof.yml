name: P286 focused proof

on:
  push:
    branches:
      - candidate/p286-proof

jobs:
  p286-focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: P286 shared execution-kernel structure
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=10s 120s node --test tests/p286-activation-shared-execution-kernel.test.js

      - name: P286 v1 JSON Vault and source-Save behaviour
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=10s 240s node --test tests/p286-activation-v1-behaviour.test.js

      - name: P039 accepted dormant activation surface guard
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=10s 120s node --test --test-name-pattern="P039 module is one dormant, inert and exact frozen activation boundary" tests/p039-sync-activation.test.js

      - name: P040 v1 adoption and resume behaviours
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=10s 240s node --test --test-name-pattern="successful adoption|genuine pre-adoption|owner-adapter failure|post-adoption persistence|adopted draft corruption|non-adopted resume" tests/p040-owner-adoption-finalisation.test.js

      - name: P041 emergency recovery compatibility
        timeout-minutes: 6
        run: timeout --signal=TERM --kill-after=10s 300s node --test tests/p041-emergency-recovery.test.js

      - name: P052 relevant activation and additional-device guards
        timeout-minutes: 7
        run: timeout --signal=TERM --kill-after=10s 360s node --test --test-name-pattern="P052 remains dormant|P052i1 rejects a bootstrap account mismatch|P052a opens a real P029 content record|P052a replays an ambiguous durable device-envelope mutation|P052b maps a wrong real P029 PRF unlock|P052c keeps tampered PRF envelopes|P052b preserves a reviewed irreversible adoption partial state|P052b accepts a production Device A activation|P052c public browser Device B adoption joins visible truth|P085 reopens the same adopted device record|P085 rejects corrupt|P104g-a classifies exact stranded activation|P085 refreshes the existing adopted record|P052c production browser adoption keeps visible truth|P052d resumes completed Device B enrolment|P052f retries a completed Device B owner-eligibility failure" tests/p052-additional-device.test.js

      - name: P285 completion-recognition compatibility
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=10s 120s node --test tests/p285-ownerless-v2-completion-recognition.test.js

      - name: P284 ownerless contract compatibility
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=10s 120s node --test tests/p284-ownerless-v2-draft-discovery.test.js

      - name: Repository check
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=10s 240s npm run check
