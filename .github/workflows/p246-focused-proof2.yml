name: P246 focused proof 2

on:
  push:
    branches:
      - candidate/p246-proof2

jobs:
  p246-focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/p243-main-known-target-selection-projection.test.js tests/p246-main-row-click-selection-locality.test.js
      - run: npm run check
