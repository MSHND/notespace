name: P342a focused proof 2

on:
  push:
    branches:
      - candidate/p342a-proof2

permissions:
  contents: read

jobs:
  p342-focused-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: P342 exact-target ownership
        run: node --test tests/p342-edit-target-ownership.test.js
      - name: Row-menu regressions
        run: node --test tests/p273-row-mini-menu-owner.test.js tests/p316-row-menu-single-owner.test.js tests/p318-post-move-row-menu-close-owner.test.js tests/p327-row-mini-menu-mobius-shell.test.js
      - name: Filter and Main selection regressions
        run: node --test tests/p249-main-type-to-filter-unification.test.js tests/p246-main-row-click-selection-locality.test.js
      - name: Canonical PE and Phone/read-only regressions
        run: node --test tests/pe-persistence-contract.test.js
      - name: Repository check
        run: npm run check
