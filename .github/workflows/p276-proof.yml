name: P276 proof

on:
  push:
    branches:
      - candidate/p276-proof

jobs:
  p276-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repository health
        run: timeout 120s npm run check
      - name: Focused first-use and adjacent New proofs
        run: >-
          timeout 300s node --test
          tests/p276-first-use-payload-owner.test.js
          tests/p255-new-pocket-first-use.test.js
          tests/p257g-human-nested-copy-starter.test.js
          tests/p176-production-composition.test.js
      - name: Adjacent persistence proofs
        run: >-
          timeout 300s node --test
          --test-name-pattern='P061/P255/P257g fresh new-Pocket truth|P061 retained recovery truth|P061 existing empty Pocket truth|P061 creation keeps the old owner intact|successful picked and newly created truth-file targets|P193k6/P255 New Pocket save picker'
          tests/pe-persistence-contract.test.js
