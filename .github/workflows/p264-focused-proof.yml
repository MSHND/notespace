name: P264 focused proof

on:
  push:
    branches:
      - candidate/p264-proof

jobs:
  p264-focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: timeout 240s node --test tests/p264-main-rapid-entry-tab.test.js tests/p229-main-shift-tab-outdent.test.js tests/p151-starling-owner-move-reorder-capture.test.js tests/p150-starling-owner-payload-capture.test.js tests/p152-starling-owner-manual-insert-capture.test.js tests/p153-starling-owner-manual-insert-undo-cancel.test.js tests/p236-main-local-reorder-projection.test.js tests/p261-main-literal-slash-entry.test.js tests/p261a-import-focus-ownership.test.js
      - run: timeout 180s npm run check
