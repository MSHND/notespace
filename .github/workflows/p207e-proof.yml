name: P207e focused proof

on:
  push:
    branches:
      - candidate/p207e-proof

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact repaired P207e candidate
        uses: actions/checkout@v4
        with:
          ref: 52bec31274dd03d317932fae66e08b90b30fe33f
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused P207, P207a and P207e proof
        run: timeout 180s node --test tests/p207-pe-empty-line-backspace.test.js tests/p207a-pe-collapsed-focus.test.js tests/p207e-pe-caret-after-empty-backspace.test.js
      - name: Run ordinary repository check
        run: npm run check
