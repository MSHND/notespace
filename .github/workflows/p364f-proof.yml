name: P364f Node 24 Regression Proof

on:
  push:
    branches:
      - candidate/p364f-proof
    paths:
      - .github/workflows/p364f-proof.yml

permissions:
  contents: read

jobs:
  regression-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07dd77efebe9100c498651173051f49f94187bcd
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify exact P364e checkout and clean tree
        run: |
          test "$(git rev-parse HEAD)" = "07dd77efebe9100c498651173051f49f94187bcd"
          test -z "$(git status --porcelain)"

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run P364 regression suite
        run: |
          node --test \
            tests/p160-starling-owner-save-preparation.test.js \
            tests/p172-real-p168-composition.test.js \
            tests/p172-real-truth-cutover-admission.test.js \
            tests/p190-starling-save-observability-and-reentry.test.js \
            tests/p346y-bounded-post-cas-acceptance.test.js \
            tests/p139-starling-logical-working-set-compose.test.js \
            tests/p146-starling-accepted-document-materialize.test.js

      - name: Run static checks
        run: npm run check
