name: P320 focused proof

on:
  push:
    branches:
      - candidate/p320-proof

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Main Enter ownership and canonical routes
        run: timeout 2m node --test --test-name-pattern="main-tree Enter remains owned only|P095 routes the real Main-tree plain Enter boundary|P098 executable PE entry-route matrix" tests/pe-persistence-contract.test.js
      - name: Filtered Main Enter ownership
        run: timeout 2m node --test --test-name-pattern="P249 immediate Enter uses existing selected-node copy route|P249 genuine editing owners" tests/p249-main-type-to-filter-unification.test.js
      - name: Delete confirmation Enter ownership
        run: timeout 2m node --test --test-name-pattern="P314 Enter, Space and Confirm delete|P281g Escape and Cancel converge|P314 ordinary Enter, Escape and Space ownership" tests/p281g-delete-confirmation-card.test.js
      - name: Helper and row-menu regressions
        run: timeout 2m node --test tests/p316-row-menu-single-owner.test.js tests/p318-post-move-row-menu-close-owner.test.js tests/p273b-plain-period-retirement.test.js tests/p320-dead-enter-retirement.test.js
      - name: Repository check
        run: timeout 3m npm run check
