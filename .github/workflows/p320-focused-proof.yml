name: P320 focused proof

on:
  push:
    branches:
      - candidate/p320-proof

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Focused P320 regressions
        run: timeout 5m node --test tests/pe-persistence-contract.test.js tests/p249-main-type-to-filter-unification.test.js tests/p281g-delete-confirmation-card.test.js tests/p316-row-menu-single-owner.test.js tests/p318-post-move-row-menu-close-owner.test.js tests/p273b-plain-period-retirement.test.js tests/p320-dead-enter-retirement.test.js
      - name: Repository check
        run: timeout 3m npm run check
