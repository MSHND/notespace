name: P210n focused proof

on:
  push:
    branches:
      - candidate/p210n-proof

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node --test tests/p210n-pe-surface-dependencies.test.js tests/p076-production-browser-boundary.test.js tests/p018-popout-isolation.test.js tests/p210d-pe-opening-focus.test.js tests/p210e-pe-body-entry-focus.test.js tests/p210-friction-pack.test.js tests/p207-pe-empty-line-backspace.test.js tests/p207a-pe-collapsed-focus.test.js tests/p207e-pe-caret-after-empty-backspace.test.js tests/p209-pe-vertical-caret-travel.test.js
