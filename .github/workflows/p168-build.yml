name: P168 construction harness
on:
  push:
    branches: [candidate/p168]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Apply P168 implementation
        run: |
          python3 .github/p168-server4.py
          python3 .github/p168-owner.py
      - name: Diff hygiene
        run: git diff --check
      - name: Core and same-owner affected tests
        run: |
          timeout 300s node --test --test-concurrency=1 \
            tests/p032-sync-remote-client.test.js \
            tests/p034-sync-service-core.test.js \
            tests/p042-synced-owner-controller.test.js \
            tests/p047-sync-postgres-store.test.js \
            tests/p049-sync-postgres-runtime.test.js \
            tests/p117-starling-object-head-postgres-store.test.js \
            tests/p119-starling-object-head-service.test.js \
            tests/p160-owner-save-preparation.test.js \
            tests/p164-starling-successor-mirror.test.js \
            tests/p166-persistence-authority-fence.test.js
      - name: Full check
        run: timeout 600s npm run check
