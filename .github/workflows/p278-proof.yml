name: P278 proof

on:
  push:
    branches:
      - candidate/p278-proof

permissions:
  contents: read

jobs:
  p278-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: P278 focused account proof
        run: timeout --signal=TERM --kill-after=10s 120s node --test tests/p031-sync-account-client.test.js
      - name: Additional-device no-consumer compatibility guards
        run: timeout --signal=TERM --kill-after=10s 90s node --test --test-name-pattern='P052 remains dormant|P052i1 rejects a bootstrap account mismatch|P052a opens a real P029 content record|P052b maps a wrong real P029 PRF unlock' tests/p052-additional-device.test.js
      - name: Activation boundary guard
        run: timeout --signal=TERM --kill-after=10s 60s node --test --test-name-pattern='P039 module is one dormant, inert and exact frozen activation boundary' tests/p039-sync-activation.test.js
      - name: Browser-runtime passkey failure guards
        run: timeout --signal=TERM --kill-after=10s 90s node --test --test-name-pattern='P045 maps browser passkey cancellation safely and does not adopt|P045 keeps unavailable, unsupported and browser-security passkey failures local and unadopted' tests/p045-browser-sync-runtime.test.js
      - name: P278 unchanged-caller seam guard
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const activation = fs.readFileSync('js/pocket-sync-activation.js', 'utf8');
          const additional = fs.readFileSync('js/pocket-sync-additional-device.js', 'utf8');
          if (!activation.includes('config.accountClient.registerPasskey({')) throw new Error('activation registration seam changed');
          if (activation.includes('authenticatePasskey(')) throw new Error('activation unexpectedly uses authentication consumer');
          const calls = additional.match(/config\.accountClient\.authenticatePasskey\(\{/g) || [];
          if (calls.length !== 2) throw new Error('additional-device authentication call count changed');
          if (additional.includes('onAuthenticated')) throw new Error('additional-device migrated to P278 consumer');
          NODE
