name: P349xn corrected exact Auth0 multi-audience proof
on:
  push:
    branches: [candidate/p349xn-proof2]
jobs:
  dormant-auth0-audience:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        timeout-minutes: 3
      - name: P349xn corrected audience and owner-publisher regressions
        run: node --test tests/p349xn-auth0-multi-audience.test.js tests/p349xh-verified-subject-binding.test.js tests/p349xf-handover-release-safety-store.test.js tests/p349-project-documents-auth.test.js tests/p349-project-documents-mcp.test.js tests/p349-project-documents-store.test.js
        timeout-minutes: 3
      - name: Normal Pocket check
        run: npm run check
        timeout-minutes: 2
