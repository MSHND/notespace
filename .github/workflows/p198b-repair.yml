name: P198b bounded candidate harness repair
on:
  push:
    branches:
      - candidate/p198b-repair
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/p198
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Guard exact pre-Starling-repair candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "28910a17ac0ac30c24fdbf2ac820d414815cad4a"
          test "$(git rev-parse HEAD^{tree})" = "5efecf3b4ab4c884bb10ba03ba6c9598a5960438"
          test -z "$(git status --porcelain)"
      - name: Repair remaining historical Starling harness dependency order
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          repairs = {
            'tests/p127-starling-remote-save.test.js': (
              '"js/pocket-outline-persistence-policy.js","js/pocket-editor-metadata.js"',
              '"js/pocket-outline-persistence-policy.js","js/pocket-node-content.js","js/pocket-editor-metadata.js"',
            ),
            'tests/p160-starling-owner-save-preparation.test.js': (
              '  "js/pocket-outline-persistence-policy.js",\n  "js/pocket-editor-metadata.js",',
              '  "js/pocket-outline-persistence-policy.js",\n  "js/pocket-node-content.js",\n  "js/pocket-editor-metadata.js",',
            ),
            'tests/p172-real-p168-composition.test.js': (
              '  "js/pocket-state.js", "js/pocket-data.js", "js/pocket-outline-persistence-policy.js",\n  "js/pocket-editor-metadata.js",',
              '  "js/pocket-state.js", "js/pocket-data.js", "js/pocket-outline-persistence-policy.js",\n  "js/pocket-node-content.js", "js/pocket-editor-metadata.js",',
            ),
          }
          for filename, (old, new) in repairs.items():
            path = Path(filename)
            text = path.read_text()
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{filename}: expected exact metadata dependency seam once, found {count}')
            path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' tests/p127-starling-remote-save.test.js tests/p160-starling-owner-save-preparation.test.js tests/p172-real-p168-composition.test.js | sort)"
          git diff --stat
      - name: Commit Starling harness repairs to real candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/p127-starling-remote-save.test.js tests/p160-starling-owner-save-preparation.test.js tests/p172-real-p168-composition.test.js
          git commit -m "P198b repair Starling regression content dependencies"
          git push origin HEAD:candidate/p198
      - name: Install
        run: timeout --signal=KILL 180s npm ci
      - name: Complete direct Starling semantic-capture slice
        run: |
          set -euo pipefail
          timeout --signal=KILL 180s node --check tests/p127-starling-remote-save.test.js
          timeout --signal=KILL 180s node --check tests/p150-starling-owner-payload-capture.test.js
          timeout --signal=KILL 180s node --check tests/p160-starling-owner-save-preparation.test.js
          timeout --signal=KILL 180s node --check tests/p168-authority-adoption.test.js
          timeout --signal=KILL 180s node --check tests/p168-starling-reentry.test.js
          timeout --signal=KILL 180s node --check tests/p172-real-p168-composition.test.js
          timeout --signal=KILL 480s node --test tests/p127-starling-remote-save.test.js
          timeout --signal=KILL 480s node --test tests/p150-starling-owner-payload-capture.test.js
          timeout --signal=KILL 480s node --test tests/p160-starling-owner-save-preparation.test.js
          timeout --signal=KILL 480s node --test tests/p168-authority-adoption.test.js
          timeout --signal=KILL 480s node --test tests/p168-starling-reentry.test.js
          timeout --signal=KILL 600s node --test tests/p172-real-p168-composition.test.js
      - name: Candidate repair delta remains bounded
        run: |
          set -euo pipefail
          test "$(git diff --name-only dcc2a21e959c1d3855dc75f046bcf855d1674ecf..HEAD | sort)" = "$(printf '%s\n' sw.js tests/device-changes-resolution.test.js tests/p019-vault-ownership.test.js tests/p127-starling-remote-save.test.js tests/p160-starling-owner-save-preparation.test.js tests/p172-real-p168-composition.test.js tests/p176-production-composition.test.js | sort)"
