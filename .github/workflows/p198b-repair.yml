name: P198b bounded candidate harness repair
on:
  push:
    branches:
      - candidate/p198b-repair
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/p198
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Guard exact post-P150-fixture candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3bf4ef612a99f7332a2d47671e158bc740e9bc6b"
          test "$(git rev-parse HEAD^{tree})" = "c39725b67cceb7d04f153d8b419d6e9c331e4a92"
          test -z "$(git status --porcelain)"
      - name: Align P150 model stub with current unified save result
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/p150-starling-owner-payload-capture.test.js')
          text = path.read_text()
          old = '      prepareSave(node, payload) { return { ok: true, changed: true, beforeLabel: node.label, nextLabel: String(payload.title || node.label), titleChanged: String(payload.title || node.label) !== node.label, notesChanged: true, nextDetails: String(payload.body || ""), editorChanged: false }; },'
          new = '      prepareSave(node, payload) { const text = String(payload.text ?? payload.body ?? ""); return { ok: true, changed: true, beforeLabel: node.label, nextLabel: String(payload.title || node.label), titleChanged: String(payload.title || node.label) !== node.label, contentChanged: true, notesChanged: true, nextText: text, nextDetails: text, editorChanged: true, editorMeta: text ? { schema: "pocket.nodeEditor.v2", text } : null, preserveRawEditor: false }; },'
          if text.count(old) != 1:
            raise SystemExit(f'expected base P150 prepareSave stub once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old = '  context.PocketNodePopoutModel.prepareSave = (current) => ({ ok: true, changed: true, beforeLabel: current.label, nextLabel: current.label, titleChanged: false, notesChanged: false, nextDetails: "", editorChanged: true, editorMeta: { outline: Array.from({ length: 401 }, (_, index) => ({ id: String(index) })) } });'
          new = '  context.PocketNodePopoutModel.prepareSave = (current) => ({ ok: true, changed: true, beforeLabel: current.label, nextLabel: current.label, titleChanged: false, contentChanged: true, notesChanged: true, nextText: "Large canonical edit", nextDetails: "Large canonical edit", editorChanged: true, editorMeta: { schema: "pocket.nodeEditor.v2", text: "Large canonical edit" }, preserveRawEditor: false });'
          if text.count(old) != 1:
            raise SystemExit(f'expected rollback P150 prepareSave stub once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only)" = "tests/p150-starling-owner-payload-capture.test.js"
          git diff --stat
      - name: Commit P150 model-stub repair to real candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/p150-starling-owner-payload-capture.test.js
          git commit -m "P198b align Starling capture model stub with unified save"
          git push origin HEAD:candidate/p198
      - name: Install
        run: timeout --signal=KILL 180s npm ci
      - name: Complete direct Starling semantic-capture slice
        run: |
          set -euo pipefail
          timeout --signal=KILL 180s node --check tests/p127-starling-remote-save.test.js
          timeout --signal=KILL 180s node --check tests/p150-starling-owner-payload-capture.test.js
          timeout --signal=KILL 180s node --check tests/p160-starling-owner-save-preparation.test.js
          timeout --signal=KILL 180s node --check tests/p168-authority-adoption.test.js
          timeout --signal=KILL 180s node --check tests/p168-starling-reentry.test.js
          timeout --signal=KILL 180s node --check tests/p172-real-p168-composition.test.js
          timeout --signal=KILL 480s node --test tests/p127-starling-remote-save.test.js
          timeout --signal=KILL 480s node --test tests/p150-starling-owner-payload-capture.test.js
          timeout --signal=KILL 480s node --test tests/p160-starling-owner-save-preparation.test.js
          timeout --signal=KILL 480s node --test tests/p168-authority-adoption.test.js
          timeout --signal=KILL 480s node --test tests/p168-starling-reentry.test.js
          timeout --signal=KILL 600s node --test tests/p172-real-p168-composition.test.js
      - name: Candidate repair delta remains bounded
        run: |
          set -euo pipefail
          test "$(git diff --name-only dcc2a21e959c1d3855dc75f046bcf855d1674ecf..HEAD | sort)" = "$(printf '%s\n' sw.js tests/device-changes-resolution.test.js tests/p019-vault-ownership.test.js tests/p127-starling-remote-save.test.js tests/p150-starling-owner-payload-capture.test.js tests/p160-starling-owner-save-preparation.test.js tests/p172-real-p168-composition.test.js tests/p176-production-composition.test.js | sort)"
