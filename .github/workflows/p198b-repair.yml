name: P198b bounded candidate harness repair
on:
  push:
    branches:
      - candidate/p198b-repair
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/p198
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Guard exact post-device candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f70aa4690489d6229b2f47a2ac37a7365a5161e9"
          test "$(git rev-parse HEAD^{tree})" = "e48fd44e142fac6a918ccbadcef0d896738c98a1"
          test -z "$(git status --porcelain)"
      - name: Repair Vault ownership harness production dependency order
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/p019-vault-ownership.test.js')
          text = path.read_text()
          old = '    "js/pocket-outline-persistence-policy.js",\n    "js/pocket-editor-metadata.js",'
          new = '    "js/pocket-outline-persistence-policy.js",\n    "js/pocket-node-content.js",\n    "js/pocket-editor-metadata.js",'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exact Vault load seam once, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "tests/p019-vault-ownership.test.js"
          git diff -- tests/p019-vault-ownership.test.js
      - name: Commit Vault harness repair to real candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/p019-vault-ownership.test.js
          git commit -m "P198b repair Vault harness content dependency"
          git push origin HEAD:candidate/p198
      - name: Install
        run: timeout --signal=KILL 180s npm ci
      - name: Direct Vault ownership regression slice
        run: |
          set -euo pipefail
          timeout --signal=KILL 120s node --check tests/p019-vault-ownership.test.js
          timeout --signal=KILL 480s node --test tests/p019-vault-ownership.test.js
