name: P198b bounded candidate harness repair
on:
  push:
    branches:
      - candidate/p198b-repair
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/p198
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Guard exact post-Starling-dependency candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dce61029bb746da4c999e678638a5bca6ea7e2bb"
          test "$(git rev-parse HEAD^{tree})" = "933ece453712e1bd6b54a66ef6996a7a39f0d53a"
          test -z "$(git status --porcelain)"
      - name: Align P150 synthetic PE fixture with current unified content owner
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/p150-starling-owner-payload-capture.test.js')
          text = path.read_text()
          replacements = [
            (
              '  class HTMLTextAreaElement extends HTMLElement { constructor(value = "") { super(); this.value = value; } }\n',
              '  class HTMLTextAreaElement extends HTMLElement { constructor(value = "") { super(); this.value = value; } }\n  class HTMLButtonElement extends HTMLElement {}\n',
              'synthetic details close path needs the current button element class',
            ),
            (
              '    HTMLElement, HTMLInputElement, HTMLTextAreaElement,\n',
              '    HTMLElement, HTMLInputElement, HTMLTextAreaElement, HTMLButtonElement,\n',
              'synthetic context must expose the button element class',
            ),
            (
              'function editorPayload(node, changes = {}) {\n  return { id: node.id, title: node.label, body: node.details || "", originalUpdatedAt: node.updatedAt, fileSessionId: 1, sourceFileName: "p150.json", sourcePipSession: false, sourceOwnerKind: "json", sourceVaultSessionId: "", ...changes };\n}\n',
              'function editorPayload(node, changes = {}) {\n  const canonicalText = changes.text ?? changes.body ?? node.editor?.text ?? node.details ?? "";\n  return { id: node.id, title: node.label, text: canonicalText, body: canonicalText, originalUpdatedAt: node.updatedAt, fileSessionId: 1, sourceFileName: "p150.json", sourcePipSession: false, sourceOwnerKind: "json", sourceVaultSessionId: "", ...changes, text: canonicalText };\n}\n',
              'PE capture fixture must mutate canonical text while retaining body only as compatibility alias',
            ),
          ]
          for old, new, label in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{label}: expected exact seam once, found {count}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only)" = "tests/p150-starling-owner-payload-capture.test.js"
          git diff --stat
      - name: Commit P150 harness repair to real candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/p150-starling-owner-payload-capture.test.js
          git commit -m "P198b align Starling capture PE fixture with unified content"
          git push origin HEAD:candidate/p198
      - name: Install
        run: timeout --signal=KILL 180s npm ci
      - name: Complete direct Starling semantic-capture slice
        run: |
          set -euo pipefail
          timeout --signal=KILL 180s node --check tests/p127-starling-remote-save.test.js
          timeout --signal=KILL 180s node --check tests/p150-starling-owner-payload-capture.test.js
          timeout --signal=KILL 180s node --check tests/p160-starling-owner-save-preparation.test.js
          timeout --signal=KILL 180s node --check tests/p168-authority-adoption.test.js
          timeout --signal=KILL 180s node --check tests/p168-starling-reentry.test.js
          timeout --signal=KILL 180s node --check tests/p172-real-p168-composition.test.js
          timeout --signal=KILL 480s node --test tests/p127-starling-remote-save.test.js
          timeout --signal=KILL 480s node --test tests/p150-starling-owner-payload-capture.test.js
          timeout --signal=KILL 480s node --test tests/p160-starling-owner-save-preparation.test.js
          timeout --signal=KILL 480s node --test tests/p168-authority-adoption.test.js
          timeout --signal=KILL 480s node --test tests/p168-starling-reentry.test.js
          timeout --signal=KILL 600s node --test tests/p172-real-p168-composition.test.js
      - name: Candidate repair delta remains bounded
        run: |
          set -euo pipefail
          test "$(git diff --name-only dcc2a21e959c1d3855dc75f046bcf855d1674ecf..HEAD | sort)" = "$(printf '%s\n' sw.js tests/device-changes-resolution.test.js tests/p019-vault-ownership.test.js tests/p127-starling-remote-save.test.js tests/p150-starling-owner-payload-capture.test.js tests/p160-starling-owner-save-preparation.test.js tests/p172-real-p168-composition.test.js tests/p176-production-composition.test.js | sort)"
