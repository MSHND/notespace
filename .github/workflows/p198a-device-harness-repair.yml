name: P198a repair device harness composition
on:
  push:
    branches:
      - candidate/p198a-repair
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/p198
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Guard exact repaired candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dcc2a21e959c1d3855dc75f046bcf855d1674ecf"
      - name: Repair device integration production-order composition
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/device-changes-resolution.test.js')
          text=p.read_text()
          old='''    "js/pocket-outline-persistence-policy.js",\n    "js/pocket-editor-metadata.js",'''
          new='''    "js/pocket-outline-persistence-policy.js",\n    "js/pocket-node-content.js",\n    "js/pocket-editor-metadata.js",'''
          if text.count(old) != 1:
              raise SystemExit(f'unexpected device harness anchor count: {text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
          git diff --check
          node --check tests/device-changes-resolution.test.js
      - name: Prove repaired device harness and active P198 contracts
        run: |
          set -euo pipefail
          timeout --signal=KILL 180s npm ci
          timeout --signal=KILL 360s node --test tests/device-changes-resolution.test.js
          timeout --signal=KILL 180s node --test tests/p198-unified-pe-document.test.js
          timeout --signal=KILL 300s node --test tests/pe-persistence-contract.test.js
          timeout --signal=KILL 180s node --test tests/p018-popout-isolation.test.js
      - name: Commit harness repair to real candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/device-changes-resolution.test.js
          git diff --cached --check
          git commit -m "P198a load content contract in device harness"
          git push origin HEAD:candidate/p198
