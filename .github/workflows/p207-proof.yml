name: P207 focused proof

on:
  push:
    branches:
      - candidate/p207-proof
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact P207 candidate
        uses: actions/checkout@v4
        with:
          ref: 161d73d3b3828fe338a68b2b6614edcc15697eee
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused P207 proof
        run: timeout 180s node --test tests/p207-pe-empty-line-backspace.test.js
      - name: Run ordinary repository check
        run: npm run check
