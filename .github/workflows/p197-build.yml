name: P197 bounded candidate construction
on:
  push:
    branches:
      - candidate/p197-proof
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/p197
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Guard candidate lineage
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 0076739343b9a30c3e56f521ec67b1d87d8b6b2e)" = "0076739343b9a30c3e56f521ec67b1d87d8b6b2e"
          test "$(git rev-list --count 0076739343b9a30c3e56f521ec67b1d87d8b6b2e..HEAD)" -eq 1
      - name: Apply production seams
        run: |
          set -euo pipefail
          git show origin/candidate/p197-proof:.github/p197-build.py > /tmp/p197-build.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/p197-build.py')
          text = p.read_text()
          old = '''  const targetChanged = truthFileHandle !== nextHandle\n    || session.displayName !== nextName\n    || session.pipSession !== nextPip\n    || session.detachedDeviceChanges !== nextDetached\n    || session.ownerKind !== nextOwnerKind\n    || session.storagePrivacy !== nextStoragePrivacy\n    || session.vaultSessionId !== nextVaultSessionId;'''
          new = '''  const targetChanged = truthFileHandle !== nextHandle\n    || session.writable !== nextWritable\n    || session.pipSession !== nextPip\n    || session.detachedDeviceChanges !== nextDetached\n    || session.ownerKind !== nextOwnerKind\n    || session.storagePrivacy !== nextStoragePrivacy\n    || session.vaultSessionId !== nextVaultSessionId;'''
          if text.count(old) != 2:
              raise SystemExit(f'expected two stale targetChanged patch literals, found {text.count(old)}')
          p.write_text(text.replace(old, new, 2))
          PY
          python /tmp/p197-build.py
          git diff --check
      - name: Install
        run: timeout --signal=KILL 180s npm ci
      - name: Focused syntax and existing boundary proof
        run: |
          set -euo pipefail
          timeout --signal=KILL 120s node --check js/pocket-starling-owner-successor.js
          timeout --signal=KILL 120s node --check js/pocket-owner-save-boundary.js
          timeout --signal=KILL 120s node --check js/pocket-io-browser.js
          timeout --signal=KILL 120s node --check js/pocket-editor-copy.js
          timeout --signal=KILL 120s node --check js/pocket-node-popout-editor.js
          timeout --signal=KILL 180s node --test tests/p043-owner-aware-save-boundary.test.js
          timeout --signal=KILL 180s node --test tests/p176-production-composition.test.js
      - name: Commit production candidate changes only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/pocket-starling-owner-successor.js js/pocket-owner-save-boundary.js js/pocket-io-browser.js js/pocket-editor-copy.js js/pocket-node-popout-editor.js
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "P197 add bounded concurrent Synced Save rebase"
          git push origin HEAD:candidate/p197
