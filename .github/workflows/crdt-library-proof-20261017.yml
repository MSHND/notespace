name: Research only - CRDT library comparison
on:
  push:
    branches:
      - candidate/crdt-library-proof-20261017
    paths:
      - 'research/crdt-library-gate/**'
      - '.github/workflows/crdt-library-proof-20261017.yml'
permissions:
  contents: read
jobs:
  real-library-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "RESEARCH_SHA=$GITHUB_SHA"
      - name: Install genuine pinned CRDT packages
        working-directory: research/crdt-library-gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          node --version | tee evidence/node-version.txt
          npm install --ignore-scripts --no-audit --no-fund 2>&1 | tee evidence/install.txt
          npm ls yjs @automerge/automerge | tee evidence/versions.txt
      - name: Execute Pocket boundary smoke checks
        working-directory: research/crdt-library-gate
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap tests/yjs.test.mjs tests/automerge.test.mjs 2>&1 | tee evidence/tests.tap
      - name: Retain exact research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crdt-real-library-evidence
          path: |
            research/crdt-library-gate/evidence/
            research/crdt-library-gate/package-lock.json
          if-no-files-found: warn
