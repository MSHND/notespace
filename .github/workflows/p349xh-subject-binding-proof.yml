name: P349xh isolated subject-binding proof
on:
  push:
    branches: [candidate/p349xh-proof]
jobs:
  subject-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        timeout-minutes: 3
      - name: P349xh subject and release-store plus legacy OAuth/MCP regression tests
        run: node --test tests/p349xh-verified-subject-binding.test.js tests/p349xf-handover-release-safety-store.test.js tests/p349-project-documents-auth.test.js tests/p349-project-documents-mcp.test.js tests/p349-project-documents-store.test.js
        timeout-minutes: 3
      - name: Pocket normal check
        run: npm run check
        timeout-minutes: 2
