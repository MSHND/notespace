name: P172 exact-candidate proof

on:
  push:
    branches: [candidate/p172-proof]

permissions:
  contents: read

jobs:
  p172-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      P172_CANDIDATE_SHA: efbd426e9865d55109da2945fa2466603df14125
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install repository dependencies
        run: |
          set -euo pipefail
          timeout 600s npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify exact candidate parent and proof-only delta
        run: |
          set -euo pipefail
          timeout 30s bash -c '
            test "$(git rev-parse HEAD^)" = "$P172_CANDIDATE_SHA"
            test "$(git rev-list --count "$P172_CANDIDATE_SHA"..HEAD)" = "1"
            test "$(git diff --name-only "$P172_CANDIDATE_SHA"..HEAD)" = ".github/workflows/p172-proof.yml"
          '

      - name: Focused P172 real cutover and admission
        run: |
          set -euo pipefail
          timeout 240s node --test --test-concurrency=1 tests/p172-real-truth-cutover-admission.test.js tests/p172-real-p168-composition.test.js

      - name: Real-history P153 cancellation and covered refusal
        run: |
          set -euo pipefail
          timeout 180s node --test --test-concurrency=1 tests/p153-starling-owner-manual-insert-undo-cancel.test.js
          timeout 120s node --test --test-concurrency=1 --test-name-pattern="^P172b real P153 covered Insert undo is refused before visible mutation in Starling mode$" tests/p172b-insert-guard-real-history.test.js

      - name: Actual delete_many undo guard and whole-record compatibility
        run: |
          set -euo pipefail
          timeout 180s node <<'NODE'
          "use strict";
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const vm = require("node:vm");
          const { webcrypto } = require("node:crypto");
          const source = (file) => fs.readFileSync(path.join(process.cwd(), file), "utf8");
          const plain = (value) => value === undefined ? undefined : JSON.parse(JSON.stringify(value));
          const makeNode = (id, order) => ({ id, parentId: "root", order, label: id, updatedAt: "2026-09-04T00:00:00.000Z" });

          function runtime(mode, outerReadFails = false) {
            class HTMLElement { focus() {} }
            class HTMLInputElement extends HTMLElement { constructor() { super(); this.value = ""; } }
            class HTMLButtonElement extends HTMLElement {}
            const storage = new Map();
            const rows = ["a", "b", "c"].map((id) => ({
              getAttribute(name) { return name === "data-node-id" ? id : null; },
              classList: { add() {}, remove() {}, toggle() {} }, focus() {},
            }));
            const treeRoot = new HTMLElement();
            treeRoot.querySelectorAll = () => rows;
            const authority = mode === "starling" ? {
              schema: "pocket.sync.persistence-authority.v1", authorityRevision: 3,
              currentMode: "starling", transition: null, rollbackRevision: 3,
              adoptionHead: { schema: "pocket.starling.head.v1", revision: 1, sealRef: "seal-1" },
            } : {
              schema: "pocket.sync.persistence-authority.v1", authorityRevision: 1,
              currentMode: "whole-record", transition: null, rollbackRevision: null, adoptionHead: null,
            };
            const context = {
              Object, Array, String, Number, Boolean, Map, Set, WeakMap, WeakSet, Error, Function, Reflect,
              JSON, Date, Math, Promise, structuredClone, HTMLElement, HTMLInputElement, HTMLButtonElement,
              crypto: webcrypto, TextEncoder, TextDecoder, Uint8Array, ArrayBuffer,
              state: {
                nodes: [makeNode("a", 10), makeNode("b", 20), makeNode("c", 30)], tombstones: [], rootExtras: {}, dataExtras: {},
                collapsed: new Set(), selectedId: "a", multiSelectedIds: new Set(["b"]), multiSelectAnchorId: "",
                focusRootId: "", moveMode: false, inlineEdit: { id: "", isNew: false }, detailsEdit: { id: "" },
                ops: [], operationHighWater: 0, operationDocumentAnchor: null, activeSaveOperationCeiling: 0,
                documentBaseline: null, conflictGuard: { active: false }, saveInProgress: false,
                source: { schema: "portal.export.v1", fileName: "p172-proof.json", writtenAt: "" },
                pocketFile: { ownerKind: "synced", displayName: "" },
              },
              lastMoveUndoSnapshot: null, lastEditUndoSnapshot: null, lastDeleteUndoSnapshot: null, lastTreeUndoKind: "",
              el: { search: new HTMLInputElement(), treeRoot },
              localStorage: {
                getItem(key) { return storage.get(String(key)) || null; },
                setItem(key, value) { storage.set(String(key), String(value)); },
              },
              DEVICE_CHANGE_SEQUENCE_KEY: "p172-proof.sequence", LAST_BACKUP_META_KEY: "p172-proof.backup",
              nowIso() { return "2026-09-04T01:00:00.000Z"; },
              cleanText(value, maximum = Number.MAX_SAFE_INTEGER) { return String(value || "").trim().slice(0, maximum); },
              compareSiblingOrder(left, right) { return (Number(left.order) || 0) - (Number(right.order) || 0); },
              nodeMap() { return new Map(context.state.nodes.map((entry) => [entry.id, entry])); },
              childrenMap() {
                const result = new Map();
                for (const entry of context.state.nodes) {
                  const parent = entry.parentId || "root";
                  if (!result.has(parent)) result.set(parent, []);
                  result.get(parent).push(entry);
                }
                for (const siblings of result.values()) siblings.sort(context.compareSiblingOrder);
                return result;
              },
              isManagedSystemBucketNode() { return false; }, isCompletedSystemBucketNode() { return false; },
              requirePocketFileForChanges() { return true; }, clearInlineEditState() {}, persistPipSnapshot() {},
              refocusTreeNavigation() {}, focusRowByNodeId() {}, softlyEnsureSelectionVisible() {}, flashTouchedRow() {},
              renderTree() {}, setStatus() {}, saveLastSaveSnapshot() {}, saveLocalSafetySnapshot() { return true; },
              confirm() { return true; }, setTimeout() { return 1; }, clearTimeout() {}, requestAnimationFrame() { return 1; },
              document: {
                readyState: "loading", currentScript: { dataset: { serviceRoot: "/sync" } },
                body: { classList: { add() {}, remove() {}, toggle() {} } },
                addEventListener() {}, getElementById() { return null; }, head: { appendChild() {} }, createElement() { return {}; },
              },
              PocketDeviceChanges: {
                cloneJsonCompatible(value) { try { return { ok: true, value: plain(value) }; } catch { return { ok: false }; } },
                coerceDocument(value) { return { ok: true, document: plain({ nodes: value.nodes || [], tombstones: value.tombstones || [], rootExtras: value.rootExtras || {}, dataExtras: value.dataExtras || {} }) }; },
                describeDocumentTransition() { return { ok: true, records: [] }; },
              },
              normaliseInput(value) { return value; }, normaliseRootExtras() { return {}; },
              PocketStarlingObjectSealShadow: {
                OBJECT_SCHEMA: "object", ROOT_SCHEMA: "root", SEAL_SCHEMA: "seal", SEQUENCE_SCHEMA: "sequence",
                canonical(value) { return { ok: true, bytes: JSON.stringify(value) }; }, refFor() { return "ref"; },
              },
              PocketStarlingBridgeShadow: { encode() { return { ok: false }; } },
              PocketStarlingPlacementShadow: { audit() { return { ok: false }; } },
              PocketStarlingLogicalEditShadow: { async compose() { return { ok: false }; } },
              PocketStarlingRemoteEditShadow: { async createEditor() { return {}; } },
              PocketStarlingDurablePublication: {
                validateDescriptor(value) { return value; }, descriptorFromPrepared(value) { return value; },
                createCoordinator() { return { async ensureObjects() {}, async attemptHead() {}, async reconcile() {} }; },
              },
              PocketSyncCrypto: { encodeBase64Url(value) { return Buffer.from(value).toString("base64url"); } },
            };
            context.window = context; context.globalThis = context;
            vm.createContext(context);
            vm.runInContext("const isPipMode=false; let saveChipTimer=null; let moveModeIdleTimer=null; let movePadRepeatStartTimer=null; let movePadRepeatInterval=null;", context);
            for (const file of [
              "js/pocket-starling-owner-working-set-shadow.js", "js/pocket-editor-copy.js",
              "js/pocket-history-status.js", "js/pocket-tree-actions.js", "js/pocket-multi-select.js",
            ]) vm.runInContext(source(file), context, { filename: file });

            const innerAuthorityService = {
              async read(input) { return { authority, syncedPocketId: input.syncedPocketId }; },
              async acquireFence() { return { authority }; }, async commitStarlingAdoption() { return { authority }; }, async releaseFence() { return { authority }; },
            };
            context.PocketSyncRemoteClient = {
              createBrowserJsonTransport() { return {}; },
              createPersistenceAuthorityService() { return {
                async read() { if (outerReadFails) throw new Error("refresh unavailable"); return { authority }; },
                async acquireFence() { return { authority }; }, async commitStarlingAdoption() { return { authority }; }, async releaseFence() { return { authority }; },
              }; },
              createObjectHeadService() { return { async readShadowHead() { return { head: authority.adoptionHead }; } }; },
            };
            context.PocketSyncOwnerController = {
              createSyncedOwnerController(configuration) {
                const service = configuration.starlingBootstrap.persistenceAuthorityService;
                return {
                  captureSyncedOwnerSaveSession() { return { syncedPocketId: "pocket-p172-proof" }; },
                  async adoptSyncedOwner() {
                    const proved = await service.read({ apiVersion: 1, operationId: "inner", syncedPocketId: "pocket-p172-proof" });
                    assert.equal(proved.authority.currentMode, mode);
                    return { ok: true };
                  },
                  async saveSyncedOwner() { return { ok: false }; }, releaseSyncedOwner() { return true; },
                };
              },
            };
            vm.runInContext(source("js/pocket-starling-real-truth-admission.js"), context, { filename: "js/pocket-starling-real-truth-admission.js" });
            const controller = context.PocketSyncOwnerController.createSyncedOwnerController({ starlingBootstrap: {
              objectHeadService: {}, persistenceAuthorityService: innerAuthorityService,
              operationIdFactory() { return "op"; }, normaliseInput(value) { return value; }, normaliseRootExtras() { return {}; },
            } });
            return { context, controller };
          }

          function deleteMany(context) {
            assert.equal(context.deleteMultiSelectionIfActive(), true);
            assert.equal(context.state.ops.at(-1).type, "delete_many");
          }

          (async () => {
            const starling = runtime("starling");
            assert.equal((await starling.controller.adoptSyncedOwner()).ok, true);
            assert.equal(starling.context.PocketStarlingRealTruthAdmission.isStarlingUndoGuardActive(), true);
            deleteMany(starling.context);
            const after = plain(starling.context.state.nodes), opCount = starling.context.state.ops.length;
            assert.equal(starling.context.undoLastDeleteAction(), false);
            assert.deepEqual(plain(starling.context.state.nodes), after);
            assert.equal(starling.context.state.ops.length, opCount);

            const unavailable = runtime("starling", true);
            assert.equal((await unavailable.controller.adoptSyncedOwner()).ok, true);
            assert.equal(unavailable.context.PocketStarlingRealTruthAdmission.isStarlingUndoGuardActive(), true);
            deleteMany(unavailable.context);
            const unavailableAfter = plain(unavailable.context.state.nodes);
            assert.equal(unavailable.context.undoLastDeleteAction(), false);
            assert.deepEqual(plain(unavailable.context.state.nodes), unavailableAfter);

            const whole = runtime("whole-record", true);
            assert.equal((await whole.controller.adoptSyncedOwner()).ok, true);
            assert.equal(whole.context.PocketStarlingRealTruthAdmission.isStarlingUndoGuardActive(), false);
            deleteMany(whole.context);
            assert.notEqual(whole.context.undoLastDeleteAction(), false);
            assert.deepEqual(plain(whole.context.state.nodes.map((entry) => entry.id)), ["a", "b", "c"]);
            assert.equal(whole.context.state.ops.at(-1).type, "undo_delete_many");
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE

      - name: P122 P139 P140 P146 semantic and publication surfaces
        run: |
          set -euo pipefail
          timeout 360s node --test --test-concurrency=1 tests/p122-starling-remote-publication.test.js tests/p139-starling-logical-working-set-compose.test.js tests/p146-starling-accepted-document-materialize.test.js
          timeout 360s node --test --test-concurrency=1 --test-name-pattern="^(P140a prepares one bounded final working set, preserving base truth without publication|P140a keeps no-change, failure, malformed grammar, and later reuse isolated)$" tests/p140-starling-remote-working-set-prepare.test.js

      - name: P151 P155 P158 and P170 history surfaces
        run: |
          set -euo pipefail
          timeout 480s node --test --test-concurrency=1 tests/p151-starling-owner-move-reorder-capture.test.js tests/p155-starling-owner-single-delete-undo-cancel.test.js tests/p158-starling-owner-multi-delete-capture.test.js tests/p133-starling-fresh-logical-delete-shadow.test.js tests/p134-starling-remote-delete-save.test.js tests/p135-starling-fresh-logical-restore-shadow.test.js tests/p136-starling-remote-restore-save.test.js

      - name: P160 P162 P164 P168 save and authority acceptance surfaces
        run: |
          set -euo pipefail
          timeout 480s node --test --test-concurrency=1 tests/p160-starling-owner-save-preparation.test.js tests/p162-starling-owner-bootstrap.test.js tests/p164-starling-successor-mirror.test.js tests/p168-authority-adoption.test.js tests/p168-starling-reentry.test.js

      - name: Affected owner browser reentry and recovery surfaces
        run: |
          set -euo pipefail
          timeout 180s node --test --test-concurrency=1 tests/p042-synced-owner-controller.test.js
          timeout 600s node --test --test-concurrency=1 tests/p041-emergency-recovery.test.js tests/p043-owner-aware-save-boundary.test.js tests/p045-browser-sync-runtime.test.js tests/p051a-local-sync-acceptance.test.js tests/p052-additional-device.test.js
          timeout 120s node --test --test-concurrency=1 --test-name-pattern="^P051 local host serves only reviewed browser assets, injects its local module and reserves the API root$" tests/p051-local-sync-integration.test.js

      - name: Production schema and shared-authority surfaces
        run: |
          set -euo pipefail
          timeout 600s node --test --test-concurrency=1 tests/p032-sync-remote-client.test.js tests/p034-sync-service-core.test.js tests/p046-sync-http-adapter.test.js tests/p047-postgres-store.test.js tests/p074-production-composition.test.js tests/p076-production-browser-boundary.test.js tests/p117-sync-object-head-postgres-store.test.js tests/p118-object-head-schema-adoption.test.js tests/p119-object-head-server-transport.test.js tests/p166-persistence-authority-fence.test.js
          timeout 120s node --test --test-concurrency=1 --test-name-pattern="^P079 uses unknown for untrusted components and retains safe schema CLI output$" tests/p079-schema-diagnostic.test.js

      - name: Full repository check
        run: |
          set -euo pipefail
          timeout 600s npm run check
