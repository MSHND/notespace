name: P236 focused proof 2

on:
  push:
    branches:
      - candidate/p236-proof2

jobs:
  p236-focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Targeted Main local reorder projection proof
        run: node --test tests/p236-main-local-reorder-projection.test.js
      - name: Broader Pocket check
        run: npm run check
