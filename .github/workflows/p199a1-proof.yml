name: P199a1 frozen candidate proof

on:
  push:
    branches:
      - candidate/p199a1-proof
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exact proof-branch guard
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "125abeb0dffdb54223275011c06c10d481f7fe5a"
          test "$(git show -s --format=%T HEAD^)" = "3a604e4467d6524288c548796c213c4b63dea832"
          test "$(git rev-parse HEAD^^)" = "292621b1a56a8e94825cc4649d6a1e898d09d503"
          test "$(git show -s --format=%T HEAD^^)" = "82794cfa60267e71283dfadc5919bf1bd703f4b1"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/p199a1-proof.yml"
          test -z "$(git diff --name-only HEAD^ HEAD -- js tests package.json package-lock.json)"
      - name: Install locked dependencies
        run: timeout 300s npm ci
      - name: Syntax check
        run: timeout 30s node --check js/pocket-io-browser.js && timeout 30s node --check tests/p199-local-file-stale-overwrite.test.js
      - name: Focused P199 stale-local-file proof
        run: |
          set -o pipefail
          timeout 180s node --test tests/p199-local-file-stale-overwrite.test.js | tee /tmp/p199a1-focused.log
          grep -Fxq 'ℹ pass 3' /tmp/p199a1-focused.log
          grep -Fxq 'ℹ fail 0' /tmp/p199a1-focused.log
      - name: Device-change regression
        run: |
          set -o pipefail
          timeout 240s node --test tests/device-changes-resolution.test.js | tee /tmp/p199a1-device.log
          grep -Fxq 'ℹ pass 78' /tmp/p199a1-device.log
          grep -Fxq 'ℹ fail 0' /tmp/p199a1-device.log
      - name: PE persistence contract
        run: |
          set -o pipefail
          timeout 240s node --test tests/pe-persistence-contract.test.js | tee /tmp/p199a1-persistence.log
          grep -Fxq 'ℹ pass 85' /tmp/p199a1-persistence.log
          grep -Fxq 'ℹ fail 0' /tmp/p199a1-persistence.log
      - name: P019 Vault ownership
        run: |
          set -o pipefail
          timeout 300s node --test tests/p019-vault-ownership.test.js | tee /tmp/p199a1-p019.log
          grep -Fxq 'ℹ fail 0' /tmp/p199a1-p019.log
      - name: P043 owner-aware save boundary
        run: |
          set -o pipefail
          timeout 180s node --test tests/p043-owner-aware-save-boundary.test.js | tee /tmp/p199a1-p043.log
          grep -Fxq 'ℹ fail 0' /tmp/p199a1-p043.log
      - name: P180 Main save cutover
        run: |
          set -o pipefail
          timeout 240s node --test tests/p180-main-save-cutover.test.js | tee /tmp/p199a1-p180.log
          grep -Fxq 'ℹ fail 0' /tmp/p199a1-p180.log
      - name: Unified PE regressions
        run: |
          set -o pipefail
          timeout 180s node --test tests/p198-unified-pe-document.test.js | tee /tmp/p199a1-p198.log
          grep -Fxq 'ℹ pass 27' /tmp/p199a1-p198.log
          grep -Fxq 'ℹ fail 0' /tmp/p199a1-p198.log
          timeout 120s node --test tests/p198h-pe-multiline-paste.test.js | tee /tmp/p199a1-p198h.log
          grep -Fxq 'ℹ fail 0' /tmp/p199a1-p198h.log
          timeout 120s node --test tests/p076-production-browser-boundary.test.js | tee /tmp/p199a1-p076.log
          grep -Fxq 'ℹ pass 5' /tmp/p199a1-p076.log
          grep -Fxq 'ℹ fail 0' /tmp/p199a1-p076.log
      - name: Pocket check
        run: |
          set -o pipefail
          timeout 300s npm run check | tee /tmp/p199a1-check.log
          grep -Fxq 'Pocket check passed' /tmp/p199a1-check.log
      - name: Final branch discipline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "125abeb0dffdb54223275011c06c10d481f7fe5a"
          test "$(git show -s --format=%T HEAD^)" = "3a604e4467d6524288c548796c213c4b63dea832"
          test "$(git rev-parse HEAD^^)" = "292621b1a56a8e94825cc4649d6a1e898d09d503"
          test "$(git show -s --format=%T HEAD^^)" = "82794cfa60267e71283dfadc5919bf1bd703f4b1"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/p199a1-proof.yml"
          test -z "$(git diff --name-only HEAD^ HEAD -- js tests package.json package-lock.json)"
