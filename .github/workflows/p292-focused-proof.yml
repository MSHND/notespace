name: P292 focused proof

on:
  push:
    branches:
      - candidate/p292-proof

jobs:
  p292-focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: P292 and historical filter regression
        timeout-minutes: 4
        run: >
          timeout --signal=TERM --kill-after=10s 180s
          node --test
          tests/p292-filter-view-state-restore.test.js
          tests/p249-main-type-to-filter-unification.test.js
          tests/p252-filter-first-actual-match.test.js
          tests/p267-filter-ordered-word-fragment-matcher.test.js
          tests/p291-main-filter-space-ownership.test.js
      - name: Repository check
        timeout-minutes: 4
        run: timeout --signal=TERM --kill-after=10s 180s npm run check
